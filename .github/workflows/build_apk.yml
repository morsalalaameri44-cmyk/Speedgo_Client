name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Generate Clean Project
        run: |
          rm -rf android/
          flutter create --project-name speedgo_client --platforms=android --org com.speedgo .

      - name: Fix AppLinks and Gradle Compatibility
        run: |
          cat << 'EOF' > fix.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application") ||
                      project.plugins.hasPlugin("com.android.library")) {
                      project.android {
                          compileSdkVersion 34
                          buildToolsVersion "34.0.0"
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }
          EOF
          sed -i '/apply from: "\$flutterRoot\/packages\/flutter_tools\/gradle\/app_plugin_loader.gradle"/i apply from: file("fix.gradle")' android/settings.gradle || true
          cat fix.gradle >> android/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedGo-Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

